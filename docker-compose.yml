services:
  postgres:
    image: postgres:16-alpine
    container_name: specialparent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: specialparent
      POSTGRES_PASSWORD: specialparent
      POSTGRES_DB: specialparent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specialparent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: specialparent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: specialparent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://specialparent:specialparent@postgres:5432/specialparent?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please}
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "604800"
      CORS_ORIGIN: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Set SMTP_URL + MAIL_FROM in .env to enable real email delivery.
      # Without SMTP_URL the mailer logs verification/reset links to
      # this container's console instead of sending them.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "4000:4000"
    command: >
      sh -c "
        npx prisma db push --accept-data-loss --skip-generate &&
        (npx prisma db seed || true) &&
        node dist/main.js
      "

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: specialparent-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

  # ─── Admin DB dashboard (opt-in) ────────────────────────────────────────
  # Adminer is a battle-tested pgAdmin-alike for browsing / editing Postgres
  # tables directly. Gated behind the `admin-tools` profile so it does NOT
  # start by default — the prod overlay never sees it, and dev users have to
  # opt in explicitly:
  #
  #     docker compose --profile admin-tools up -d adminer
  #
  # Login screen at http://localhost:8080 with:
  #   System:   PostgreSQL
  #   Server:   postgres          (pre-filled)
  #   Username: specialparent
  #   Password: specialparent     (matches POSTGRES_PASSWORD above)
  #   Database: specialparent
  #
  # SECURITY: this exposes full DB access to whoever can reach localhost:8080.
  # We bind to 127.0.0.1 so remote hosts on the same LAN can't hit it, but do
  # NOT run this in production without a real auth proxy (Traefik + OIDC or
  # similar). All actions here bypass the app's audit interceptor.
  adminer:
    image: adminer:5-standalone
    container_name: specialparent-adminer
    restart: unless-stopped
    profiles: ["admin-tools"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  postgres-data:
