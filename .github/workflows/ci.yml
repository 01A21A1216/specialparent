name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push arrives —
# saves minutes on rebase-heavy PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sp
          POSTGRES_PASSWORD: sp
          POSTGRES_DB: sp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Real DATABASE_URL so Prisma can generate + validate against a real DB.
      DATABASE_URL: postgresql://sp:sp@localhost:5432/sp?schema=public
      # 32-byte placeholders — env validation rejects shorter strings on boot.
      JWT_ACCESS_SECRET: 00000000000000000000000000000000
      JWT_REFRESH_SECRET: 11111111111111111111111111111111
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Prisma db push (validates schema against real Postgres)
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Test
        working-directory: backend
        run: npm test -- --ci --reporters=default --reporters=summary

  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        # React 19 RC + Next 15 → peer dep mismatch, needs legacy resolver.
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Silence Sentry build plugin — no DSN in CI.
          SENTRY_DSN: ''
        run: npm run build

  docker:
    name: Docker — smoke build
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: specialparent-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          tags: specialparent-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
